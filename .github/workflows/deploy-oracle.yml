name: Deploy Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: true

env:
  ORACLE_HOST: ${{ vars.ORACLE_HOST || '137.131.207.151' }}
  ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/sci-nvt' }}
  DEPLOY_BRANCH: main

jobs:
  deploy:
    name: Deploy production stack
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -n "${ORACLE_SSH_KEY_B64:-}" ]; then
            printf '%s' "$ORACLE_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/oracle_key
          elif [ -n "${ORACLE_SSH_KEY:-}" ]; then
            printf '%s\n' "$ORACLE_SSH_KEY" | sed 's/\r$//' > ~/.ssh/oracle_key
          else
            echo "Missing SSH key secret. Create ORACLE_SSH_KEY_B64 or ORACLE_SSH_KEY in GitHub Actions secrets." >&2
            exit 1
          fi

          chmod 600 ~/.ssh/oracle_key

          if ! ssh-keygen -y -f ~/.ssh/oracle_key >/dev/null; then
            echo "Invalid SSH private key secret." >&2
            echo "Recommended fix: create ORACLE_SSH_KEY_B64 with the Base64 content of the private .key file." >&2
            exit 1
          fi

          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Oracle VM
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REPO_URL='$REPO_URL' DEPLOY_BRANCH='$DEPLOY_BRANCH' EXPECTED_SHA='$EXPECTED_SHA' GITHUB_TOKEN_VALUE='$GITHUB_TOKEN_VALUE' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          if [ ! -d .git ]; then
            git init
          fi

          git config --global --add safe.directory "$DEPLOY_PATH" >/dev/null 2>&1 || true
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "$REPO_URL"

          auth_repo_url="$(printf '%s' "$REPO_URL" | sed "s#https://github.com/#https://x-access-token:${GITHUB_TOKEN_VALUE}@github.com/#")"
          git fetch --prune --force "$auth_repo_url" "+refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          git reset --hard "refs/remotes/origin/$DEPLOY_BRANCH"
          git checkout -B "$DEPLOY_BRANCH" "refs/remotes/origin/$DEPLOY_BRANCH"
          git branch --set-upstream-to="origin/$DEPLOY_BRANCH" "$DEPLOY_BRANCH" >/dev/null 2>&1 || true
          git clean -fd -e .env.production -e local-public-data.sql
          export DEPLOY_COMMIT="$(git rev-parse HEAD)"

          if [ "$DEPLOY_COMMIT" != "$EXPECTED_SHA" ]; then
            echo "VM checkout mismatch. Expected $EXPECTED_SHA, got $DEPLOY_COMMIT." >&2
            exit 1
          fi

          if [ ! -f .env.production ]; then
            echo ".env.production is missing in $DEPLOY_PATH" >&2
            exit 1
          fi

          echo "Deploying commit $DEPLOY_COMMIT"
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres
          docker compose --env-file .env.production -f docker-compose.prod.yml build backend web
          docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend npm run db:migrate
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-build --force-recreate backend web

          backend_health=""
          for attempt in $(seq 1 30); do
            backend_health="$(docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend wget -qO- http://127.0.0.1:3333/api/health 2>/dev/null || true)"
            if printf '%s' "$backend_health" | grep -q "$DEPLOY_COMMIT"; then
              echo "Backend health OK for commit $DEPLOY_COMMIT"
              break
            fi
            sleep 5
          done

          if ! printf '%s' "$backend_health" | grep -q "$DEPLOY_COMMIT"; then
            echo "Backend did not report deployed commit $DEPLOY_COMMIT." >&2
            echo "Last /api/health response: ${backend_health:-<empty>}" >&2
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=120 backend web >&2
            exit 1
          fi

          web_build_info="$(docker compose --env-file .env.production -f docker-compose.prod.yml exec -T web cat /srv/build-info.json 2>/dev/null || true)"
          if ! printf '%s' "$web_build_info" | grep -q "$DEPLOY_COMMIT"; then
            echo "Web container did not contain build-info for commit $DEPLOY_COMMIT." >&2
            echo "Last /srv/build-info.json: ${web_build_info:-<empty>}" >&2
            docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=120 web >&2
            exit 1
          fi

          docker image prune -f
          echo "Deploy finished successfully for commit $DEPLOY_COMMIT"
          REMOTE
