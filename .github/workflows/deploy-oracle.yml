name: Deploy Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: true

env:
  ORACLE_HOST: 137.131.207.151
  ORACLE_USER: ubuntu
  DEPLOY_PATH: /home/ubuntu/sci-nvt
  DEPLOY_BRANCH: main

jobs:
  deploy:
    name: Deploy production stack
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -n "${ORACLE_SSH_KEY_B64:-}" ]; then
            printf '%s' "$ORACLE_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/oracle_key
          elif [ -n "${ORACLE_SSH_KEY:-}" ]; then
            printf '%s\n' "$ORACLE_SSH_KEY" | sed 's/\r$//' > ~/.ssh/oracle_key
          else
            echo "Missing SSH key secret. Create ORACLE_SSH_KEY_B64 or ORACLE_SSH_KEY in GitHub Actions secrets." >&2
            exit 1
          fi

          chmod 600 ~/.ssh/oracle_key

          if ! ssh-keygen -y -f ~/.ssh/oracle_key >/dev/null; then
            echo "Invalid SSH private key secret." >&2
            echo "Recommended fix: create ORACLE_SSH_KEY_B64 with the Base64 content of the private .key file." >&2
            exit 1
          fi

          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Oracle VM
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REPO_URL='$REPO_URL' DEPLOY_BRANCH='$DEPLOY_BRANCH' GITHUB_TOKEN_VALUE='$GITHUB_TOKEN_VALUE' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          if [ ! -d .git ]; then
            git init
          fi

          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "$REPO_URL"

          auth_repo_url="$(printf '%s' "$REPO_URL" | sed "s#https://github.com/#https://x-access-token:${GITHUB_TOKEN_VALUE}@github.com/#")"
          git fetch --prune "$auth_repo_url" "$DEPLOY_BRANCH"
          git reset --hard FETCH_HEAD
          git clean -fd -e .env.production -e local-public-data.sql
          export DEPLOY_COMMIT="$(git rev-parse HEAD)"

          if [ ! -f .env.production ]; then
            echo ".env.production is missing in $DEPLOY_PATH" >&2
            exit 1
          fi

          echo "Deploying commit $DEPLOY_COMMIT"
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres
          docker compose --env-file .env.production -f docker-compose.prod.yml build backend web
          docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend npm run db:migrate
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-build --force-recreate backend web
          docker image prune -f
          REMOTE
