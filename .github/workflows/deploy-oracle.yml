name: Deploy Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: true

env:
  ORACLE_HOST: ${{ vars.ORACLE_HOST || '137.131.207.151' }}
  ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/sci-nvt' }}
  DEPLOY_BRANCH: main

jobs:
  verify:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Se algo quebrar aqui, o deploy nao acontece e producao fica na versao anterior.
      - name: Verify
        run: npm run verify

  deploy:
    name: Deploy production stack
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -n "${ORACLE_SSH_KEY_B64:-}" ]; then
            printf '%s' "$ORACLE_SSH_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/oracle_key
          elif [ -n "${ORACLE_SSH_KEY:-}" ]; then
            printf '%s\n' "$ORACLE_SSH_KEY" | sed 's/\r$//' > ~/.ssh/oracle_key
          else
            echo "Missing SSH key secret. Create ORACLE_SSH_KEY_B64 or ORACLE_SSH_KEY in GitHub Actions secrets." >&2
            exit 1
          fi

          chmod 600 ~/.ssh/oracle_key

          if ! ssh-keygen -y -f ~/.ssh/oracle_key >/dev/null; then
            echo "Invalid SSH private key secret." >&2
            echo "Recommended fix: create ORACLE_SSH_KEY_B64 with the Base64 content of the private .key file." >&2
            exit 1
          fi

          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Copy deploy script to Oracle VM
        run: |
          scp -i ~/.ssh/oracle_key deploy/deploy-production.sh "$ORACLE_USER@$ORACLE_HOST:/tmp/sci-nvt-deploy-production.sh"

      - name: Deploy on Oracle VM
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          # O token vai pela entrada padrao: nao aparece na linha de comando nem na lista de processos da VM.
          printf '%s' "$GITHUB_TOKEN_VALUE" | ssh -i ~/.ssh/oracle_key "$ORACLE_USER@$ORACLE_HOST" \
            "GITHUB_TOKEN_VALUE=\$(cat) DEPLOY_PATH='$DEPLOY_PATH' REPO_URL='$REPO_URL' DEPLOY_BRANCH='$DEPLOY_BRANCH' EXPECTED_SHA='$EXPECTED_SHA' bash /tmp/sci-nvt-deploy-production.sh < /dev/null"
