services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_COMMIT: ${DEPLOY_COMMIT:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3333}
      API_PREFIX: ${API_PREFIX:-api}
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      AUTENTIQUE_TOKEN: ${AUTENTIQUE_TOKEN:-}
      STORAGE_PATH: /app/backend/storage
    volumes:
      - backend_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BUILD_COMMIT: ${DEPLOY_COMMIT:-local}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    environment:
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config:
